<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何彦秀 · 成长记录</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            /* 护眼豆沙绿 RGB:204,232,207 */
            background-color: #cce8cf;
            font-family: "微软雅黑",sans-serif;
            padding:40px 20px;
        }
        .title-box{
            text-align:center;
            margin-bottom:45px;
        }
        h1{
            color:#2c442e;
            font-size:32px;
            letter-spacing:4px;
        }
        .sub-text{
            color:#4b6b4d;
            margin-top:12px;
            font-size:17px;
        }
        .container{
            max-width:1100px;
            margin:0 auto;
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
            gap:26px;
        }
        .img-item{
            overflow:hidden;
            border-radius:14px;
            background:#fff;
            padding:8px;
            transition:0.3s ease;
            cursor:pointer;
        }
        .img-item:hover{
            transform: translateY(-6px);
            box-shadow:0 8px 20px #00000022;
        }
        .img-item img{
            width:100%;
            height:240px;
            object-fit:cover;
            display:block;
            border-radius:8px;
        }
        .footer-tip{
            text-align:center;
            margin-top:60px;
            color:#4b6b4d;
        }
        /* 点击图片放大弹窗 */
        .lightbox{
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.82);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:99;
            padding:20px;
        }
        .lightbox img{
            max-width:90%;
            max-height:90%;
            border-radius:6px;
        }
        .lightbox.active{display:flex;}
    </style>
</head>
<body>
    <div class="title-box">
        <h1>何彦秀</h1>
        <div class="sub-text">从高中到现在的成长记录</div>
    </div>

    <div class="container">
        <div class="img-item"><img src="agr.jpg" alt="成长照片"></div>
        <div class="img-item"><img src="dr.jpg" alt="成长照片"></div>
        <div class="img-item"><img src="eg.jpg" alt="成长照片"></div>
        <div class="img-item"><img src="fjp.jpg" alt="成长照片"></div>
        <div class="img-item"><img src="fwa.jpg" alt="成长照片"></div>
    </div>

    <div class="footer-tip">
        慢慢成长，闪闪发光 ✨
    </div>

    <div class="lightbox" id="lb">
        <img id="lbimg">
    </div>
    <script>
        const box = document.getElementById('lb');
        const lbimg = document.getElementById('lbimg');
        document.querySelectorAll('.img-item img').forEach(img=>{
            img.onclick = ()=>{
                lbimg.src = img.src;
                box.classList.add('active');
            }
        })
        box.onclick = ()=> box.classList.remove('active');
    </script>
</body>
</html>
