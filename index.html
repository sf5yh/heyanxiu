<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>heyanxiu · 生活碎片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #fff8fa;
            padding: 50px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 45px;
        }
        h1 {
            color: #444;
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .subtitle {
            color: #999;
            font-size: 16px;
            letter-spacing: 2px;
        }
        /* 相册网格排版 */
        .photo-gallery {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .photo-item img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }
        .photo-item img:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.13);
        }
        .words {
            max-width: 700px;
            margin: 60px auto 0;
            text-align: center;
            color: #777;
            line-height: 2;
            font-size: 17px;
        }
        /* 点击放大弹窗 */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
        .close-btn {
            position: absolute;
            top: 24px;
            right: 32px;
            color: #fff;
            font-size: 42px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>heyanxiu · 生活碎片</h1>
        <div class="subtitle">收集每一个温柔瞬间</div>
    </div>

    <div class="photo-gallery">
        <div class="photo-item">
            <img src="agr.jpg" onclick="openPic(this.src)">
        </div>
        <div class="photo-item">
            <img src="dr.jpg" onclick="openPic(this.src)">
        </div>
        <div class="photo-item">
            <img src="eg.jpg" onclick="openPic(this.src)">
        </div>
        <div class="photo-item">
            <img src="fj.jpg" onclick="openPic(this.src)">
        </div>
        <div class="photo-item">
            <img src="fwra.jpg" onclick="openPic(this.src)">
        </div>
    </div>

    <div class="words">
        这里写上想对她说的话
    </div>

    <div class="lightbox" id="lb">
        <span class="close-btn" onclick="closePic()">×</span>
        <img id="bigImg">
    </div>

    <script>
        function openPic(src){
            document.getElementById('bigImg').src = src;
            document.getElementById('lb').classList.add('active');
        }
        function closePic(){
            document.getElementById('lb').classList.remove('active');
        }
    </script>
</body>
</html>
